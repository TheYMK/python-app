
name: cicd

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kaymkassai269/python-app
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Update Helm values.yaml
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
        run: |
          echo "Updating image tag to: $IMAGE_TAG"

          sed -i -E \
            "s/^  tag: .*/  tag: \"$IMAGE_TAG\"/" \
            charts/python-app/values.yaml

          cat charts/python-app/values.yaml

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/python-app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update python-app image tag [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Install Argocd
        shell: bash
        run: |
          VERSION=$(curl -L -s https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION)
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/v$VERSION/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64
      - name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd --plaintext --insecure --grpc-web --username ${{ secrets.ARGOCD_USERNAME }} --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app
